name: Temporary PR545 Manual Validation

on:
  pull_request:
    branches:
      - WorkInProgress
    paths:
      - docs/developers/ManualGenESyS_subrepo/**
      - .github/workflows/temporary-pr545-manual-validation.yml

permissions:
  contents: write

jobs:
  manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-science \
            texlive-plain-generic \
            biber \
            poppler-utils \
            ripgrep

      - name: Validate figure specifications
        working-directory: docs/developers/ManualGenESyS_subrepo
        run: ./validate_figure_specs.sh

      - name: Build manual
        working-directory: docs/developers/ManualGenESyS_subrepo
        run: ./make.sh

      - name: Check generated PDF and unresolved references
        working-directory: docs/developers/ManualGenESyS_subrepo
        run: |
          test -s ../../ManualGenESyS.pdf
          pdfinfo ../../ManualGenESyS.pdf
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|Package rerunfilecheck Warning: File .* has changed" ManualGenESyS.log; then
            echo "Unresolved LaTeX references/citations detected." >&2
            exit 1
          fi

      - name: Commit refreshed published manual
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- docs/ManualGenESyS.pdf; then
            echo "Published manual PDF is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ManualGenESyS.pdf
            git commit -m "docs: refresh GenESyS manual PDF"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p manual-evidence
          cp -f docs/developers/ManualGenESyS_subrepo/ManualGenESyS.log manual-evidence/ 2>/dev/null || true
          cp -f docs/ManualGenESyS.pdf manual-evidence/ 2>/dev/null || true
          {
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "merge_sha=${{ github.sha }}"
          } > manual-evidence/metadata.txt

      - name: Upload manual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr545-manual-validation
          path: manual-evidence/
          if-no-files-found: error
