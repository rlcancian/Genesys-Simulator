name: GenESyS CI

run-name: GenESyS CI | ${{ github.event_name }} | ref=${{ github.ref_name }} | sha=${{ github.sha }} | preset=tests-unit

on:
  pull_request:
    branches:
      - 2026-1
      - WorkInProgress
      - WiP20261
      - currentStable
      - master
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_CONFIGURE_PRESET: tests-unit
  CMAKE_BUILD_PRESET: tests-unit
  CMAKE_TEST_PRESET: tests-unit

jobs:
  unit-tests:
    name: Diagnose tests-unit CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev >/dev/null
          cmake --version | head -n 1
          ninja --version
          g++ --version | head -n 1

      - name: Configure, build and version CTest diagnostics
        run: |
          set -Eeuo pipefail
          mkdir -p .github/ai-diagnostics
          summary=.github/ai-diagnostics/ctest-first-failure.txt
          echo "HEAD=$(git rev-parse HEAD)" > "${summary}"
          cmake --preset "${CMAKE_CONFIGURE_PRESET}" >/tmp/genesys-configure.log 2>&1
          cmake --build --preset "${CMAKE_BUILD_PRESET}" --parallel "$(nproc)" >/tmp/genesys-build.log 2>&1
          set +e
          ctest --preset "${CMAKE_TEST_PRESET}" --output-on-failure >/tmp/genesys-ctest.log 2>&1
          rc=$?
          set -e
          echo "CTEST_RC=${rc}" >> "${summary}"
          if [[ "${rc}" -ne 0 ]]; then
            tail -n 360 /tmp/genesys-ctest.log >> "${summary}"
            git config user.name "genesys-ci-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "${summary}"
            git commit -m "ci: record CTest failure tail" || true
            git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
            exit "${rc}"
          fi
          echo "CTEST_OK" >> "${summary}"
          git config user.name "genesys-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${summary}"
          git commit -m "ci: record CTest success" || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || true
