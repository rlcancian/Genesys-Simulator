name: GenESyS CI

run-name: GenESyS CI | ${{ github.event_name }} | ref=${{ github.ref_name }} | sha=${{ github.sha }} | preset=tests-unit

on:
  pull_request:
    branches:
      - 2026-1
      - WorkInProgress
      - WiP20261
      - currentStable
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesys-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_CONFIGURE_PRESET: tests-unit
  CMAKE_BUILD_PRESET: tests-unit
  CMAKE_TEST_PRESET: tests-unit

jobs:
  unit-tests:
    name: Configure, build and test tests-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect moved GUI include corruption
        run: |
          set -Eeuo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Checking for real preprocessor include directives containing more than one #include token."
          matches="$({ grep -RInE '^\s*#\s*include.*#\s*include' source/applications/gui/genesys --include='*.h' --include='*.hpp' --include='*.cpp' --include='*.cc' --include='*.cxx' || true; } | head -n 40)"
          if [[ -n "${matches}" ]]; then
            echo "FOUND_CONCATENATED_INCLUDES"
            printf '%s\n' "${matches}"
            exit 1
          fi
          echo "No concatenated real include directives found."

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev >/dev/null
          cmake --version | head -n 1
          ninja --version
          g++ --version | head -n 1

      - name: Configure - CMake preset tests-unit
        run: |
          set -Eeuo pipefail
          cmake --preset "${CMAKE_CONFIGURE_PRESET}" >/tmp/genesys-configure.log 2>&1 || {
            echo "CONFIGURE_FAILED"
            tail -n 120 /tmp/genesys-configure.log
            exit 1
          }
          echo "CONFIGURE_OK"

      - name: Build - CMake preset tests-unit
        run: |
          set -Eeuo pipefail
          mkdir -p .genesys-ci-diagnostics
          build_log=.genesys-ci-diagnostics/build-tests-unit.log
          set +e
          cmake --build --preset "${CMAKE_BUILD_PRESET}" --parallel "$(nproc)" >"${build_log}" 2>&1
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            echo "BUILD_FAILED rc=${rc}"
            first=$(grep -Ein '(^|[^A-Za-z])(error:|fatal error:|undefined reference|cannot find|No such file|CMake Error|ninja: build stopped|collect2: error|ld returned)' "${build_log}" | head -n 1 | cut -d: -f1 || true)
            if [[ -n "${first}" ]]; then
              start=$((first - 20))
              end=$((first + 80))
              [[ "${start}" -lt 1 ]] && start=1
              echo "FIRST_ERROR_LINE=${first}"
              sed -n "${start},${end}p" "${build_log}"
            else
              echo "FIRST_ERROR_LINE=not_found"
              tail -n 120 "${build_log}"
            fi
            exit "${rc}"
          fi
          echo "BUILD_OK"

      - name: Tests - CTest preset tests-unit
        run: |
          set -Eeuo pipefail
          ctest --preset "${CMAKE_TEST_PRESET}" --output-on-failure
