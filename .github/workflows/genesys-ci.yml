name: GenESyS CI

run-name: GenESyS CI | ${{ github.event_name }} | ref=${{ github.ref_name }} | sha=${{ github.sha }} | gui-gmdd-diagnostics

on:
  pull_request:
    branches:
      - 2026-1
      - WorkInProgress
      - WiP20261
      - currentStable
      - master
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  CMAKE_CONFIGURE_PRESET: tests-unit

jobs:
  gui-gmdd-diagnostics:
    name: Diagnose failing GUI GMDD tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev >/dev/null
          cmake --version | head -n 1
          ninja --version
          g++ --version | head -n 1

      - name: Build and run failing GUI GMDD tests
        run: |
          set -Eeuo pipefail
          mkdir -p .genesys-ci-diagnostics
          out=.genesys-ci-diagnostics/gui-gmdd-test-failures.txt
          echo "HEAD=$(git rev-parse HEAD)" > "${out}"
          cmake --preset "${CMAKE_CONFIGURE_PRESET}" >/tmp/genesys-configure.log 2>&1
          cmake --build build/tests-unit --target genesys_test_gui_gmdd_layout --parallel "$(nproc)" >/tmp/genesys-build-gui-gmdd.log 2>&1
          exe=$(find build/tests-unit -type f -name genesys_test_gui_gmdd_layout | head -n 1)
          echo "EXE=${exe}" >> "${out}"
          set +e
          "${exe}" --gtest_filter='GuiGmddLayout.SeizeEditableReferencesStayAboveAndLowerDefinitionsUseTwoRows:GuiGmddLayout.SerializerRoundTripRestoresComponentColorAndDataDefinitionPosition:GuiGmddLayout.SerializerRoundTripRestoresViewStateGeometriesAndGroups' > /tmp/gui-gmdd-tests.log 2>&1
          rc=$?
          set -e
          echo "GTEST_RC=${rc}" >> "${out}"
          cat /tmp/gui-gmdd-tests.log >> "${out}"
          cat "${out}"
          exit "${rc}"

      - name: Upload GUI GMDD diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesys-gui-gmdd-diagnostics
          path: .genesys-ci-diagnostics
          if-no-files-found: error
