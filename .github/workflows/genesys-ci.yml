name: GenESyS CI

run-name: GenESyS CI | ${{ github.event_name }} | ref=${{ github.ref_name }} | sha=${{ github.sha }} | preset=tests-unit

on:
  pull_request:
    branches:
      - 2026-1
      - WorkInProgress
      - WiP20261
      - currentStable
      - master
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_CONFIGURE_PRESET: tests-unit
  CMAKE_BUILD_PRESET: tests-unit
  CMAKE_TEST_PRESET: tests-unit

jobs:
  unit-tests:
    name: Configure, build and test tests-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout PR head branch
        run: |
          set -Eeuo pipefail
          branch="${{ github.event.pull_request.head.ref }}"
          echo "PR_HEAD_BRANCH=${branch}"
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          git checkout -q -B "${branch}" "refs/remotes/origin/${branch}"
          echo "CHECKOUT_OK=$(git rev-parse --short HEAD)"

      - name: Auto-repair concatenated moved GUI includes
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("source/applications/gui/genesys")
          extensions = {".h", ".hpp", ".hh", ".cpp", ".cc", ".cxx"}
          changed_files = 0
          changed_includes = 0
          details = []

          for path in sorted(p for p in base.rglob("*") if p.is_file() and p.suffix in extensions):
              try:
                  lines = path.read_text(encoding="utf-8").splitlines(True)
              except UnicodeDecodeError:
                  continue

              new_lines = []
              touched = False
              for index, line in enumerate(lines, start=1):
                  stripped = line.lstrip()
                  if not stripped.startswith("#include"):
                      new_lines.append(line)
                      continue

                  fixed, count = re.subn(r'(?<=[">])#\s*include', r'\n#include', line)
                  new_lines.append(fixed)
                  if count:
                      touched = True
                      changed_includes += count
                      details.append(f"{path}:{index}: inserted_newlines={count}")

              if touched:
                  path.write_text("".join(new_lines), encoding="utf-8")
                  changed_files += 1

          print(f"changed_files={changed_files}")
          print(f"changed_includes={changed_includes}")
          for detail in details[:80]:
              print(detail)
          PY

          if git diff --quiet -- source/applications/gui/genesys; then
            echo "AUTO_REPAIR_RESULT=no_changes"
            exit 0
          fi

          echo "AUTO_REPAIR_CHANGED_FILES_BEGIN"
          git diff --name-only -- source/applications/gui/genesys | sed -n '1,120p'
          echo "AUTO_REPAIR_CHANGED_FILES_END"

          git config user.name "genesys-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add source/applications/gui/genesys
          git commit -m "fix: repair concatenated includes after GUI move"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          echo "AUTO_REPAIR_RESULT=pushed"
          echo "A new commit was pushed; stop this run so the next run validates the repaired branch."
          exit 1

      - name: Verify no concatenated moved GUI includes remain
        run: |
          set -Eeuo pipefail
          matches="$({ grep -RInE '^\s*#\s*include.*#\s*include' source/applications/gui/genesys --include='*.h' --include='*.hpp' --include='*.cpp' --include='*.cc' --include='*.cxx' || true; } | head -n 40)"
          if [[ -n "${matches}" ]]; then
            echo "FOUND_CONCATENATED_INCLUDES"
            printf '%s\n' "${matches}"
            exit 1
          fi
          echo "NO_CONCATENATED_INCLUDES"

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev >/dev/null
          cmake --version | head -n 1
          ninja --version
          g++ --version | head -n 1

      - name: Configure - CMake preset tests-unit
        run: |
          set -Eeuo pipefail
          cmake --preset "${CMAKE_CONFIGURE_PRESET}" >/tmp/genesys-configure.log 2>&1 || {
            echo "CONFIGURE_FAILED"
            tail -n 120 /tmp/genesys-configure.log
            exit 1
          }
          echo "CONFIGURE_OK"

      - name: Build - CMake preset tests-unit
        run: |
          set -Eeuo pipefail
          build_log=/tmp/build-tests-unit.log
          set +e
          cmake --build --preset "${CMAKE_BUILD_PRESET}" --parallel "$(nproc)" >"${build_log}" 2>&1
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            echo "BUILD_FAILED rc=${rc}"
            first=$(grep -Ein '(^|[^A-Za-z])(error:|fatal error:|undefined reference|cannot find|No such file|CMake Error|ninja: build stopped|collect2: error|ld returned)' "${build_log}" | head -n 1 | cut -d: -f1 || true)
            if [[ -n "${first}" ]]; then
              start=$((first - 20))
              end=$((first + 80))
              [[ "${start}" -lt 1 ]] && start=1
              echo "FIRST_ERROR_LINE=${first}"
              sed -n "${start},${end}p" "${build_log}"
            else
              echo "FIRST_ERROR_LINE=not_found"
              tail -n 120 "${build_log}"
            fi
            exit "${rc}"
          fi
          echo "BUILD_OK"

      - name: Tests - CTest preset tests-unit
        run: |
          set -Eeuo pipefail
          ctest --preset "${CMAKE_TEST_PRESET}" --output-on-failure
