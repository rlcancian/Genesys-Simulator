name: GenESyS CI

run-name: GenESyS CI | ${{ github.event_name }} | ref=${{ github.ref_name }} | sha=${{ github.sha }} | preset=tests-unit

on:
  pull_request:
    branches:
      - 2026-1
      - WorkInProgress
      - WiP20261
      - currentStable
      - master
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_CONFIGURE_PRESET: tests-unit
  CMAKE_BUILD_PRESET: tests-unit
  CMAKE_TEST_PRESET: tests-unit

jobs:
  unit-tests:
    name: Diagnose tests-unit CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev >/dev/null
          cmake --version | head -n 1
          ninja --version
          g++ --version | head -n 1

      - name: Configure, build and summarize CTest
        run: |
          set -Eeuo pipefail
          echo "CONFIGURE_BEGIN"
          cmake --preset "${CMAKE_CONFIGURE_PRESET}" >/tmp/genesys-configure.log 2>&1
          echo "CONFIGURE_OK"
          echo "BUILD_BEGIN"
          cmake --build --preset "${CMAKE_BUILD_PRESET}" --parallel "$(nproc)" >/tmp/genesys-build.log 2>&1
          echo "BUILD_OK"
          echo "CTEST_BEGIN"
          set +e
          ctest --preset "${CMAKE_TEST_PRESET}" --output-on-failure >/tmp/genesys-ctest.log 2>&1
          rc=$?
          set -e
          echo "CTEST_RC=${rc}"
          if [[ "${rc}" -ne 0 ]]; then
            line=$(grep -n '^The following tests FAILED:' /tmp/genesys-ctest.log | tail -n 1 | cut -d: -f1 || true)
            if [[ -n "${line}" ]]; then
              start=$((line - 20)); end=$((line + 220)); [[ "${start}" -lt 1 ]] && start=1
              echo "CTEST_FAILURE_SUMMARY_BEGIN"
              sed -n "${start},${end}p" /tmp/genesys-ctest.log
              echo "CTEST_FAILURE_SUMMARY_END"
            else
              echo "CTEST_TAIL_BEGIN"
              tail -n 300 /tmp/genesys-ctest.log
              echo "CTEST_TAIL_END"
            fi
            exit "${rc}"
          fi
          echo "CTEST_OK"
