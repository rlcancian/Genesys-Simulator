name: GenESyS CI

run-name: GenESyS CI | ${{ github.event_name }} | ref=${{ github.ref_name }} | sha=${{ github.sha }} | preset=tests-unit

on:
  pull_request:
    branches:
      - 2026-1
      - WorkInProgress
      - WiP20261
      - currentStable
      - master
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_CONFIGURE_PRESET: tests-unit
  CMAKE_TEST_PRESET: tests-unit

jobs:
  unit-tests:
    name: Configure, build and test tests-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify moved GUI includes are clean
        run: |
          set -Eeuo pipefail
          matches="$({ grep -RInE '^\s*#\s*include.*#\s*include' source/applications/gui/genesys --include='*.h' --include='*.hpp' --include='*.cpp' --include='*.cc' --include='*.cxx' || true; } | head -n 40)"
          if [[ -n "${matches}" ]]; then
            echo "FOUND_CONCATENATED_INCLUDES"
            printf '%s\n' "${matches}"
            exit 1
          fi
          echo "NO_CONCATENATED_INCLUDES"

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev >/dev/null
          cmake --version | head -n 1
          ninja --version
          g++ --version | head -n 1

      - name: Configure - CMake preset tests-unit
        run: |
          set -Eeuo pipefail
          cmake --preset "${CMAKE_CONFIGURE_PRESET}" >/tmp/genesys-configure.log 2>&1 || {
            echo "CONFIGURE_FAILED"
            tail -n 120 /tmp/genesys-configure.log
            exit 1
          }
          echo "CONFIGURE_OK"

      - name: Build non-GUI unit targets
        run: |
          set -Eeuo pipefail
          targets=(
            genesys_test_util
            genesys_test_simulator_support
            genesys_test_simulator_runtime
            genesys_test_parser_expressions
            genesys_test_cellular_automata_neighborhood
            genesys_test_support_modelmanager
            genesys_test_support_persistence
            genesys_test_runtime_pluginmanager
            genesys_test_wcm_plugins
            genesys_test_support_oneventmanager
            genesys_test_support_parsermanager
            genesys_test_support_tracemanager
            genesys_test_support_connectionmanager
            genesys_test_support_simulationscenario
            genesys_test_support_experimentmanager
            genesys_test_statistics
            genesys_test_tools_hypothesistester
            genesys_test_tools_simulation_results_dataset
            genesys_test_web_api_router
            genesys_test_kernel_simulator_method_inventory
          )
          for target in "${targets[@]}"; do
            echo "BUILD_TARGET_BEGIN ${target}"
            build_log="/tmp/build-${target}.log"
            set +e
            cmake --build build/tests-unit --target "${target}" --parallel "$(nproc)" >"${build_log}" 2>&1
            rc=$?
            set -e
            if [[ "${rc}" -ne 0 ]]; then
              echo "BUILD_TARGET_FAILED ${target} rc=${rc}"
              first=$(grep -Ein '(^|[^A-Za-z])(error:|fatal error:|undefined reference|cannot find|No such file|CMake Error|ninja: build stopped|collect2: error|ld returned)' "${build_log}" | head -n 1 | cut -d: -f1 || true)
              if [[ -n "${first}" ]]; then
                start=$((first - 20)); end=$((first + 80)); [[ "${start}" -lt 1 ]] && start=1
                echo "FIRST_ERROR_LINE=${first}"
                sed -n "${start},${end}p" "${build_log}"
              else
                echo "FIRST_ERROR_LINE=not_found"
                tail -n 120 "${build_log}"
              fi
              exit "${rc}"
            fi
            echo "BUILD_TARGET_OK ${target}"
          done

      - name: Build GUI render strategy target
        run: |
          set -Eeuo pipefail
          build_log=/tmp/build-gui-render-strategy.log
          set +e
          cmake --build build/tests-unit --target genesys_test_gui_render_strategy --parallel "$(nproc)" >"${build_log}" 2>&1
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            echo "BUILD_GUI_RENDER_STRATEGY_FAILED rc=${rc}"
            first=$(grep -Ein '(^|[^A-Za-z])(error:|fatal error:|undefined reference|cannot find|No such file|CMake Error|ninja: build stopped|collect2: error|ld returned)' "${build_log}" | head -n 1 | cut -d: -f1 || true)
            if [[ -n "${first}" ]]; then
              start=$((first - 20)); end=$((first + 80)); [[ "${start}" -lt 1 ]] && start=1
              echo "FIRST_ERROR_LINE=${first}"
              sed -n "${start},${end}p" "${build_log}"
            else
              echo "FIRST_ERROR_LINE=not_found"
              tail -n 120 "${build_log}"
            fi
            exit "${rc}"
          fi
          echo "BUILD_GUI_RENDER_STRATEGY_OK"

      - name: Build GUI GMDD layout target
        run: |
          set -Eeuo pipefail
          build_log=/tmp/build-gui-gmdd-layout.log
          set +e
          cmake --build build/tests-unit --target genesys_test_gui_gmdd_layout --parallel "$(nproc)" >"${build_log}" 2>&1
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            echo "BUILD_GUI_GMDD_LAYOUT_FAILED rc=${rc}"
            first=$(grep -Ein '(^|[^A-Za-z])(error:|fatal error:|undefined reference|cannot find|No such file|CMake Error|ninja: build stopped|collect2: error|ld returned)' "${build_log}" | head -n 1 | cut -d: -f1 || true)
            if [[ -n "${first}" ]]; then
              start=$((first - 20)); end=$((first + 80)); [[ "${start}" -lt 1 ]] && start=1
              echo "FIRST_ERROR_LINE=${first}"
              sed -n "${start},${end}p" "${build_log}"
            else
              echo "FIRST_ERROR_LINE=not_found"
              tail -n 120 "${build_log}"
            fi
            exit "${rc}"
          fi
          echo "BUILD_GUI_GMDD_LAYOUT_OK"

      - name: Tests - CTest preset tests-unit
        run: |
          set -Eeuo pipefail
          ctest --preset "${CMAKE_TEST_PRESET}" --output-on-failure
