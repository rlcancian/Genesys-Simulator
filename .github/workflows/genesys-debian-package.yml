name: GenESyS Debian Package

run-name: GenESyS Debian Package | ${{ github.event_name }} | ref=${{ github.ref_name }} | sha=${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - WiP20261
    paths:
      - '../../packaging/debian/**'
      - 'packaging/linux/**'
      - 'source/**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - '.github/workflows/genesys-debian-package.yml'
  pull_request:
    branches:
      - WiP20261
      - 2026-1
    paths:
      - '../../packaging/debian/**'
      - 'packaging/linux/**'
      - 'source/**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - '.github/workflows/genesys-debian-package.yml'

permissions:
  contents: read

concurrency:
  group: genesys-debian-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  debian-package:
    name: Build Debian packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Debian packaging permissions
        run: |
          set -Eeuo pipefail
          chmod +x debian/rules

      - name: Install Debian packaging dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            cmake \
            ninja-build \
            g++ \
            pkgconf \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl-dev \
            lintian \
            appstream

      - name: Build Debian binary packages
        run: |
          set -Eeuo pipefail
          dpkg-buildpackage -us -uc -b 2>&1 | tee genesys-debian-build.log

      - name: Collect artifacts and diagnostics
        if: always()
        run: |
          set +e
          mkdir -p genesys-debian-diagnostics genesys-debian-packages
          cp -v genesys-debian-build.log genesys-debian-diagnostics/ 2>/dev/null || true
          cp -v ../*.build genesys-debian-diagnostics/ 2>/dev/null || true
          cp -v ../*.buildinfo genesys-debian-diagnostics/ 2>/dev/null || true
          cp -v ../*.changes genesys-debian-diagnostics/ 2>/dev/null || true
          cp -v build-debian/CMakeFiles/CMakeOutput.log genesys-debian-diagnostics/ 2>/dev/null || true
          cp -v build-debian/CMakeFiles/CMakeError.log genesys-debian-diagnostics/ 2>/dev/null || true
          find build-debian -type f \( -name '*.log' -o -name 'LastTest.log' \) -exec cp -v {} genesys-debian-diagnostics/ \; 2>/dev/null || true
          cp -v ../*.deb genesys-debian-packages/ 2>/dev/null || true
          cp -v ../*.buildinfo genesys-debian-packages/ 2>/dev/null || true
          cp -v ../*.changes genesys-debian-packages/ 2>/dev/null || true
          find genesys-debian-diagnostics genesys-debian-packages -maxdepth 2 -type f | sort

      - name: Validate AppStream metadata
        if: always()
        run: |
          set +e
          appstreamcli validate --no-net packaging/linux/io.github.rlcancian.genesys.metainfo.xml 2>&1 | tee genesys-debian-diagnostics/genesys-appstream.log
          exit 0

      - name: Run lintian
        if: always()
        run: |
          set +e
          lintian genesys-debian-packages/*.deb 2>&1 | tee genesys-debian-diagnostics/genesys-lintian.log
          exit 0

      - name: Upload Debian packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesys-debian-packages
          path: genesys-debian-packages/
          if-no-files-found: ignore

      - name: Upload Debian diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesys-debian-diagnostics
          path: genesys-debian-diagnostics/
          if-no-files-found: ignore

      - name: Verify Debian packages were produced
        if: always()
        run: |
          set -Eeuo pipefail
          package_count="$(find genesys-debian-packages -maxdepth 1 -type f -name '*.deb' | wc -l)"
          echo "debian_package_count=${package_count}"
          if [[ "${package_count}" -eq 0 ]]; then
            echo "::error::No Debian .deb package was produced. Check genesys-debian-diagnostics."
            exit 1
          fi
