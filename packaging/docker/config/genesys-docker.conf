# Shell configuration for GenESyS Docker helpers.
# Scripts source this file if present; users can override any value via env.

GENESYS_REPOSITORY_URL="${GENESYS_REPOSITORY_URL:-https://github.com/rlcancian/Genesys-Simulator.git}"
GENESYS_RUNTIME_BRANCH="${GENESYS_RUNTIME_BRANCH:-master}"
GENESYS_RUNTIME_IMAGE="${GENESYS_RUNTIME_IMAGE:-genesys-simulator-runtime}"
GENESYS_DEVELOPMENT_IMAGE="${GENESYS_DEVELOPMENT_IMAGE:-genesys-simulator-development}"
GENESYS_CONTAINER_PREFIX="${GENESYS_CONTAINER_PREFIX:-genesys}"
GENESYS_BUILD_TYPE="${GENESYS_BUILD_TYPE:-Release}"
GENESYS_DEFAULT_IDE="${GENESYS_DEFAULT_IDE:-qtcreator}"
GENESYS_DOCKER_PLATFORM="${GENESYS_DOCKER_PLATFORM:-}"
GENESYS_ENABLE_WAYLAND="${GENESYS_ENABLE_WAYLAND:-0}"
GENESYS_STATE_DIR="${GENESYS_STATE_DIR:-${GENESYS_DOCKER_ROOT}/.state}"
GENESYS_CACHE_DIR="${GENESYS_CACHE_DIR:-${GENESYS_STATE_DIR}/cache}"
GENESYS_SOURCE_CACHE_DIR="${GENESYS_SOURCE_CACHE_DIR:-${GENESYS_STATE_DIR}/sources}"
GENESYS_BUILD_CACHE_DIR="${GENESYS_BUILD_CACHE_DIR:-${GENESYS_STATE_DIR}/build}"
GENESYS_INSTALL_DIR="${GENESYS_INSTALL_DIR:-/opt/genesys}"
GENESYS_GUI_FORWARDING="${GENESYS_GUI_FORWARDING:-x11}"
GENESYS_XAUTH_FILE="${GENESYS_XAUTH_FILE:-${HOME}/.Xauthority}"
GENESYS_QT_PLUGIN_PATH="${GENESYS_QT_PLUGIN_PATH:-/usr/lib/x86_64-linux-gnu/qt6/plugins}"
